$kind: http-request
method: POST
url: '{{base_url}}/api/newsletters/'
order: 5000
headers:
  - key: Authorization
    value: 'Token {{journalist_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Postman demonstration newsletter",
      "description": "A newsletter created through Postman.",
      "articles": [{{pending_article_id}}]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Newsletter is created', function () { pm.response.to.have.status(201); });
